spring.application.name=railskylines

# ===== MySQL (config có default local; password: SECRET -> env only) =====
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/railskylines}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

# ===== Spring Security default user (password: SECRET -> env only) =====
spring.security.user.name=${SPRING_SECURITY_USER_NAME:admin}
spring.security.user.password=${SPRING_SECURITY_USER_PASSWORD}

# ===== Multipart =====
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ===== JWT (SECRET -> env only) =====
railskylines.jwt.base64-secret=${JWT_BASE64_SECRET}
railskylines.jwt.access-token-validity-in-seconds=8640000
railskylines.jwt.refresh-token-validity-in-seconds=8640000

# ===== Upload path (config có default) =====
railskylines.upload-file.base-uri=${RAILSKYLINES_UPLOAD_BASE_URI:file:///app/upload/}

# ===== Pagination =====
spring.data.web.pageable.one-indexed-parameters=true

# ===== Mail (host/port + username có default; password: SECRET -> env only) =====
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:dinhtrung0012@gmail.com}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===== VNPay (config có default; secretKey: SECRET -> env only) =====
vnpay.tmnCode=${VNPAY_TMN_CODE:58X4B4HP}
vnpay.secretKey=${VNPAY_SECRET_KEY}
vnpay.url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.returnUrl=${VNPAY_RETURN_URL:http://localhost:8080/api/v1/callback}
vnpay.version=2.1.0
vnpay.command=pay
vnpay.orderType=other

# ===== Pusher (config có default; secret: SECRET -> env only) =====
pusher.app-id=${PUSHER_APP_ID:2059050}
pusher.key=${PUSHER_KEY:95fc976d5de6139cdebe}
pusher.secret=${PUSHER_SECRET}
pusher.cluster=${PUSHER_CLUSTER:ap1}
